name: Update neofetch card

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_neofetch.py"
      - ".github/workflows/neofetch.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Refresh neofetch stats
        env:
          # Prefer a PAT with read:user if private contributions should be counted.
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: mangeshraut712
        run: python scripts/update_neofetch.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neofetch.svg README.md
          if git diff --staged --quiet; then
            echo "No neofetch changes"
            exit 0
          fi
          git commit -m "Update neofetch stats - [Skip GitHub Action]"
          git pull --rebase origin main
          git push origin HEAD:main
