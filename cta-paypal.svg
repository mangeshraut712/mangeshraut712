<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="64" viewBox="0 0 220 64" role="img" aria-label="Sponsor with PayPal">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F9EFF"/>
      <stop offset="50%" stop-color="#0070BA"/>
      <stop offset="100%" stop-color="#003087"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="100%" stop-color="#001F5B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0070BA" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <rect x="10" y="14" width="200" height="42" rx="14" fill="url(#edge)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="2.6s" repeatCount="indefinite"/>
      <rect x="10" y="8" width="200" height="42" rx="14" fill="url(#face)"/>
      <rect x="10" y="8" width="200" height="42" rx="14" fill="url(#shine)">
        <animate attributeName="x" values="-200;220" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <!-- PayPal double-P mark (simplified) -->
      <path d="M52 20h18c8.2 0 13.2 4.1 11.8 12.1-1.6 9.2-8.2 12.1-16.6 12.1h-6.2l-2.2 10.8H48L52 20zm8.4 6.2l-2.4 11.6h5.1c4.4 0 7.4-1.6 8.2-6.2.7-4-1.4-5.4-5.6-5.4h-5.3z" fill="#FFFFFF" opacity="0.95"/>
      <path d="M66 18h18c8.2 0 13.2 4.1 11.8 12.1-1.6 9.2-8.2 12.1-16.6 12.1h-6.2l-2.2 10.8h-8.8L66 18zm8.4 6.2l-2.4 11.6h5.1c4.4 0 7.4-1.6 8.2-6.2.7-4-1.4-5.4-5.6-5.4h-5.3z" fill="#FFC439" opacity="0.95"/>
      <text x="128" y="36" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="15" font-weight="700" letter-spacing="0.4">Sponsor</text>
    </g>
  </g>
</svg>
