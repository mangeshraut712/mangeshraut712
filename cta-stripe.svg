<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="64" viewBox="0 0 220 64" role="img" aria-label="Sponsor with Stripe">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A73FF"/>
      <stop offset="45%" stop-color="#635BFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#635BFF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 3D depth slab -->
  <g filter="url(#soft)">
    <rect x="10" y="14" width="200" height="42" rx="14" fill="url(#edge)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="2.4s" repeatCount="indefinite"/>
      <rect x="10" y="8" width="200" height="42" rx="14" fill="url(#face)"/>
      <rect x="10" y="8" width="200" height="42" rx="14" fill="url(#shine)">
        <animate attributeName="x" values="-200;220" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Stripe mark -->
      <path d="M54 24c0-3.3 2.7-5.2 7.1-5.2 6.2 0 13.2 1.9 19 5.5v6.5c-5.9-2.8-11.6-4.4-16.3-4.4-2.7 0-4.5 1.1-4.5 3 0 5.9 25.6 2.5 25.6 18.9 0 5.9-5.1 9.8-12.3 9.8-6.7 0-12.8-2.2-19.4-6.5v-6.8c6.3 3.3 12 5.2 17.1 5.2 3.1 0 5.2-1.3 5.2-3.5 0-6.7-25.5-2.8-25.5-18.5z" fill="#FFFFFF"/>
      <text x="128" y="36" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="15" font-weight="700" letter-spacing="0.4">Sponsor</text>
    </g>
  </g>
</svg>
