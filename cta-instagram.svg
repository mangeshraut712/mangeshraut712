      <text x="84" y="29" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="14" font-weight="700">Instagram</text>
    </g>
