<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1104 200" role="img" aria-label="Contribution trajectory by year">
  <rect width="1104" height="200" rx="28" fill="#000000" />
